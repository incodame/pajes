maven: {}
client-annotations:
  - name: EnumValue
    properties:
      - values
  - name: ValueRange
    properties:
      - lower
      - upper
  - name: ApiExpectedFormat
    properties:
      - select
      - format
    semantic-properties:
      - format
  - name: ApiTerm 
    properties:
      - select
      - term
    semantic-properties:
      - term      
semantic-mappings:
  prefixes:
    xsd: "http://www.w3.org/2001/XMLSchema#"
    time: "http://www.w3.org/2006/time#"
  terms:
    # If the Java annotation says format="isoDate", map to xsd:date
    "isoDate": "xsd:date"
    # If the Java annotation says format="timestamp", map to xsd:dateTime
    "timestamp": "xsd:dateTime"
    # If you are testing structured objects rather than strings
    "structuredCalendar": "time:GeneralDateTimeDescription"   
controlled-terms:
  "class":
    comment: "a java class"
    alternatives:
      - "java class"
      - "java component"
      - "java type"
      - "return type"
      - "type"
    machine-reads:
      - "Class"
      - "CtClass"
      - "CtType"
    subclasses:
      - "abstract class"
      - "inner class"
  "abstract class":
    comment: "an abstract java class"
  "inner class":
    comment: "a java class defined inside another class"
    alternatives:
      - "nested class"
    subclasses:
      - "anonymous inner class"
  "anonymous inner class":
    comment: "a java class defined by an interface and created dynamically inside another class"
    