maven: {}
client-annotations:
  - name: EnumValue
    properties:
      - values
  - name: ValueRange
    properties:
      - lower
      - upper
  - name: ApiExpectedFormat
    properties:
      - select
      - format
    semantic-properties:
      - format
semantic-mappings:
  prefixes:
    xsd: "http://www.w3.org/2001/XMLSchema#"
    time: "http://www.w3.org/2006/time#"
  terms:
    # If the Java annotation says format="isoDate", map to xsd:date
    "isoDate": "xsd:date"
    # If the Java annotation says format="timestamp", map to xsd:dateTime
    "timestamp": "xsd:dateTime"
    # If you are testing structured objects rather than strings
    "structuredCalendar": "time:GeneralDateTimeDescription"      